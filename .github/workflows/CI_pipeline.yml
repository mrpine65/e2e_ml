name: Machine Learning CI Pipeline

on:  
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out source code
      uses: actions/checkout@v5.0.0

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.10'

    - name: Create credentials.yaml from secrets
      run: |
        mkdir -p src/config
        cat > src/config/credentials.yaml <<EOF
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        POSTGRESQL: ${{ secrets.POSTGRESQL }}
        S3: ${{ secrets.S3 }}
        EC2_URL: ${{ secrets.EC2_URL }}
        EOF

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run server (background)
      run: |
        nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &

    - name: Run tests
      run: |
        pytest --cov-report html:reports/cov_html --cov=. tests/ --disable-warnings
